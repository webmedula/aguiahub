{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="card" style="max-width:400px;margin:60px auto;padding:30px">
  <h2>Entrar no Águiahub</h2>
  {% if erro %}
  <div class="aviso" style="border-color:rgba(208,69,63,.4);
       background:rgba(208,69,63,.1)">Senha incorreta.</div>
  {% endif %}
  <form method="post" action="/entrar">
    <label>Senha</label>
    <input type="password" name="senha" required autofocus
           style="width:100%;font-size:16px;padding:11px">
    <p style="margin-top:16px">
      <button type="submit" style="font-size:16px;padding:11px 20px">Entrar</button></p>
  </form>
</div>
{% endblock %}
